<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | Survey</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="auth-screen">
    <a class="auth-brand" href="index.html">Survey<span>.</span></a>
    <section class="auth-card">
      <div class="auth-symbol">S.</div>
      <p class="eyebrow">JOIN SURVEYKE</p>
      <h1>Create your account</h1>
      <p class="muted">Start earning rewards for your opinions.</p>
      <form id="register-form">
        <label for="full_name">Full name</label>
        <input id="full_name" name="full_name" type="text" required minlength="2" placeholder="Your full name">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" required placeholder="you@example.com">
        <label for="country_code">Country (2-letter code)</label>
        <input id="country_code" name="country_code" type="text" maxlength="2" placeholder="KE" value="KE">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required minlength="8" placeholder="At least 8 characters">
        <p id="auth-error" class="message error" hidden></p>
        <p id="auth-success" class="message" hidden></p>
        <button class="primary-button full-button" type="submit" id="register-button">Create account</button>
      </form>
      <a class="back-link" href="dashboard.html">Already have an account? Sign in →</a>
    </section>
  </div>
  <script src="js/dashboard-config.js"></script>
  <script>
    (function () {
      const API = (window.SURVEY_API_BASE || "").replace(/\/$/, "");
      const form = document.getElementById("register-form");
      const err = document.getElementById("auth-error");
      const ok = document.getElementById("auth-success");
      const btn = document.getElementById("register-button");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        err.hidden = true; ok.hidden = true;
        btn.disabled = true; btn.textContent = "Creating...";

        const payload = {
          full_name: document.getElementById("full_name").value.trim(),
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
          country_code: document.getElementById("country_code").value.trim().toUpperCase() || null
        };

        try {
          const res = await fetch(`${API}/api/auth/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!res.ok) {
            const msg = typeof data.detail === "string" ? data.detail : (data.detail?.[0]?.msg || "Registration failed.");
            throw new Error(msg);
          }

          // In development the API returns a verification token; auto-verify.
          if (data.verification_token) {
            const v = await fetch(`${API}/api/auth/verify-email`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token: data.verification_token })
            });
            if (!v.ok) throw new Error("Account created, but email verification failed.");
            ok.textContent = "Account created. Redirecting to sign-in...";
            ok.hidden = false;
            setTimeout(() => window.location.href = "dashboard.html", 1200);
          } else {
            ok.textContent = "Account created. Check your email to verify, then sign in.";
            ok.hidden = false;
          }
        } catch (e2) {
          err.textContent = e2.message || "Registration failed.";
          err.hidden = false;
        } finally {
          btn.disabled = false; btn.textContent = "Create account";
        }
      });
    })();
  </script>
</body>
</html>
